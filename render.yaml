# Publicación opcional. Requiere una cuenta Render y un plan con disco persistente.
services:
  - type: web
    name: el-yonkesito
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /health
    disk:
      name: datos-yonkesito
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: YONKESITO_DATA
        value: /var/data/yonkesito
      - key: YONKESITO_SECURE_COOKIE
        value: "1"
      - key: YONKESITO_TRUST_PROXY
        value: "1"
      - key: YONKESITO_PASSWORD_HASH
        sync: false
